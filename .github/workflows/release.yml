# Builds the arm64 app bundle by following BUILD-arm64.md.
# Pushing a tag v* publishes the zipped bundle as a GitHub Release;
# a manual run only uploads it as a workflow artifact.

name: Build and release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew bundle
          echo "/opt/homebrew/opt/qt@5/bin" >> "$GITHUB_PATH"

      - name: Fetch libraries
        run: |
          ./repoint install
          git -C svcore apply ../patches/svcore/0001-ringbuffer-member-access.patch

      - name: Configure
        run: qmake -r sonic-lineup.pro

      - name: Build
        run: ./build.sh

      - name: Verify
        run: |
          app="Sonic Lineup.app"
          "$app/Contents/MacOS/Sonic Lineup" -v
          codesign -v --deep --strict "$app"
          if find "$app" -type f -exec otool -L {} \; 2>/dev/null | grep -E '/opt/homebrew|/usr/local'; then
              echo "Bundle still references Homebrew paths" >&2
              exit 1
          fi

      - name: Package
        id: package
        run: |
          app="Sonic Lineup.app"
          version=$(perl -n -e 'print $1 if /"([^"]*)"/' version.h)
          minos=$(find "$app" -type f -exec otool -l {} \; 2>/dev/null |
                  awk '/minos/ { print $2 }' | sort -V | tail -n 1)
          zip="Sonic-Lineup-$version-arm64.zip"
          ditto -c -k --keepParent "$app" "$zip"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "minos=$minos" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.zip }}
          path: ${{ steps.package.outputs.zip }}

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ steps.package.outputs.zip }}
          VERSION: ${{ steps.package.outputs.version }}
          MINOS: ${{ steps.package.outputs.minos }}
        run: |
          cat > notes.md <<EOF
          Sonic Lineup $VERSION for Apple Silicon, built from $GITHUB_SHA.

          Requires macOS $MINOS or later on Apple Silicon. The app is ad hoc
          signed, not notarized; see the README for first launch.
          EOF
          gh release create "$GITHUB_REF_NAME" "$ZIP" \
              --title "Sonic Lineup $VERSION (arm64), $GITHUB_REF_NAME" \
              --notes-file notes.md
